<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چک‌لیست کبد چرب</title>
<style>
body{font-family:Tahoma,sans-serif;background:#f4f7f2;margin:0;padding:16px;color:#222}
h1{font-size:20px;text-align:center;color:#2e6b3a}
label{display:block;background:#fff;padding:12px;margin:8px 0;border-radius:10px;box-shadow:0 1px 3px #0002}
input{margin-left:8px;transform:scale(1.3)}
button{width:100%;padding:14px;font-size:16px;background:#2e6b3a;color:#fff;border:0;border-radius:10px;margin-top:10px}
#res{margin-top:14px;padding:14px;border-radius:10px;background:#fff;display:none;line-height:1.9}
small{display:block;margin-top:12px;color:#666;text-align:center}
</style>
</head>
<body>
<h1>چک‌لیست علائم کبد چرب</h1>
<div id="list"></div>
<button onclick="check()">نتیجه رو ببین</button>
<div id="res"></div>
<small>این چک‌لیست تشخیص پزشکی نیست. علائم ممکنه در بیماری‌های دیگه هم دیده بشه و تشخیص با پزشکه.</small>
<script>
var items=["خستگی مداوم بدون دلیل","نفخ و سنگینی بعد از غذا","درد یا سنگینی بالای شکم سمت راست","چاقی شکمی (دور شکم زیاد)","خارش پوست","تیرگی پوست گردن یا زیر بغل","حالت تهوع یا بی‌اشتهایی","مصرف زیاد نوشابه و شیرینی","کم‌تحرکی","شام دیروقت یا شب‌خوری"];
var l=document.getElementById("list");
items.forEach(function(t){l.innerHTML+='<label><input type="checkbox">'+t+'</label>'});
function check(){
var n=document.querySelectorAll("input:checked").length;
var m=n<=2?"تعداد علائم کمه، ولی مراقب سبک زندگی‌ت باش.":n<=5?"چند مورد از علائم رو داری. خوبه آزمایش خون کبد و سونوگرافی انجام بدی.":"موارد زیادی رو داری. بهتره زودتر به پزشک مراجعه کنی و سونوگرافی بدی.";
var r=document.getElementById("res");
r.style.display="block";
r.innerHTML="<b>"+n+" مورد از "+items.length+"</b><br>"+m;
}
</script>
</body>
</html>
