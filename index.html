<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>چک‌لیست کبد چرب</title>
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8b5e34">
<style>
body{font-family:Tahoma,sans-serif;background:#faf5ec;margin:0;padding:16px;color:#3b2a1a}
h1{font-size:20px;text-align:center;color:#8b5e34}
label{display:block;background:#fffdf8;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #eadfcb;box-shadow:0 1px 3px #8b5e3422}
.box{background:#fffdf8;padding:14px;border-radius:10px;border:1px solid #eadfcb;line-height:2;box-shadow:0 1px 3px #8b5e3422}
input{margin-left:8px;transform:scale(1.3);accent-color:#8b5e34}
button,a.b{display:block;box-sizing:border-box;width:100%;padding:14px;font-size:16px;background:#8b5e34;color:#fff;border:0;border-radius:10px;margin-top:10px;text-align:center;text-decoration:none}
#res{margin-top:14px;padding:14px;border-radius:10px;background:#fffdf8;border:1px solid #eadfcb;display:none;line-height:1.9}
hr{border:0;border-top:1px solid #eadfcb}
small{display:block;margin-top:12px;color:#7a6a58;text-align:center}
</style>
</head>
<body>
<h1 id="t"></h1>
<div id="list"></div>
<button id="btn" onclick="next()"></button>
<div id="res"></div>
<small>این چک‌لیست تشخیص پزشکی نیست. علائم ممکنه در بیماری‌های دیگه هم دیده بشه و تشخیص با پزشکه.</small>
<script>
var LINK="https://survey.porsline.ir/s/zMw9TFY3";
var INTRO="با این چک‌لیست ساده، در حدود ۲ دقیقه علائم و عادت‌های سبک زندگی‌ت رو که به کبد چرب ربط دارن بررسی می‌کنی.<br>اول علائم رو تیک بزن، بعد عادت‌های روزمره‌ت رو. آخر هم یه نتیجه و راهنمایی بهت نشون داده می‌شه.<br>نتیجه‌ی این چک‌لیست فقط برای آگاهی و راهنمایی اولیه‌ست.";
var symptoms=["خستگی مداوم بدون دلیل","نفخ و سنگینی بعد از غذا","درد یا سنگینی بالای شکم سمت راست","چاقی شکمی (دور شکم زیاد)","خارش پوست","تیرگی پوست گردن یا زیر بغل","حالت تهوع یا بی‌اشتهایی","ریزش مو","بدخوابی","گزگز پا","بی‌نظمی قاعدگی (بانوان)"];
var habits=["مصرف زیاد نوشابه و شیرینی","کم‌تحرکی","شام دیروقت یا شب‌خوری","خواب نامنظم یا شب‌بیداری","سابقه کبد چرب در خانواده","استرس بالا"];
var step=-1,a=0;
function show(){
var l=document.getElementById("list");
l.innerHTML="";
if(step==-1){
document.getElementById("t").textContent="چک‌لیست کبد چرب";
l.innerHTML='<div class="box">'+INTRO+'</div>';
document.getElementById("btn").textContent="شروع";
}else{
var arr=step==0?symptoms:habits;
document.getElementById("t").textContent=step==0?"علائم کبد چرب":"عادت‌های سبک زندگی";
arr.forEach(function(t){l.innerHTML+='<label><input type="checkbox">'+t+'</label>'});
document.getElementById("btn").textContent=step==0?"بعدی":"نتیجه رو ببین";
}
window.scrollTo(0,0);
}
function next(){
if(step==-1){step=0;show();return;}
var n=document.querySelectorAll("input:checked").length;
if(step==0){a=n;step=1;show();}else{finish(a,n);}
}
function finish(s,h){
document.getElementById("t").textContent="نتیجه";
document.getElementById("list").style.display="none";
document.getElementById("btn").style.display="none";
var t=s+h;
var m="<b>علائم:</b> "+s+" از "+symptoms.length+" | <b>عادت‌ها:</b> "+h+" از "+habits.length+"<hr>";
if(t<=2){
m+="سعی کن سالم‌تر زندگی کنی.";
}else{
m+=t<=4?"حواست رو بیشتر جمع کن، بهتره زودتر مشاوره تخصصی بگیری.":"دیگه دست‌دست نکن و همین الان فرم مشاوره رو پر کن.";
m+="<p>برای تشخیص قطعی، آزمایش کبد و سونوگرافی هم لازمه.</p>";
m+="<a class='b' target='_blank' href='"+LINK+"'>فرم مشاوره</a>";
m+="<p>اگه قصد درمان و بهبودی با طب نوین گیاهی، زیر نظر مشاور طب سنتی با ۴۰ سال سابقه داری، همین حالا فرم رو پر کن تا در اسرع وقت باهات تماس بگیریم.</p>";
}
var r=document.getElementById("res");
r.style.display="block";
r.innerHTML=m;
window.scrollTo(0,0);
}
show();
</script>
</body>
</html>
